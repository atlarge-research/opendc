name: Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  merge_group:
  workflow_dispatch:

jobs:
  build:
    name: Build (Java ${{ matrix.java }} - ${{ matrix.os }})
    if: github.repository == 'atlarge-research/opendc'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        java: [ 21 ]
        include:
          - os: windows-2022
            java: 21
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

#      - name: Install M3SA Python requirements
#        run: pip install -r opendc-experiments/opendc-experiments-m3sa/src/main/python/requirements.txt
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only write to the cache for builds on the 'master' branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build
        run: ./gradlew build assembleDist codeCoverageReport
      # The suite runs on H2. This runs the server distribution against the PostgreSQL the Ubuntu
      # image ships (no Docker), which is what checks the schema against the production dialect.
      - name: Smoke test against PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER opendc WITH PASSWORD 'opendc'" -c "CREATE DATABASE opendc OWNER opendc"
          ./gradlew :opendc-web:opendc-web-server:installDist
          cd opendc-web/opendc-web-server/build/install/opendc-server
          OPENDC_AUTH_MODE=anonymous \
            OPENDC_DB_URL=jdbc:postgresql://localhost:5432/opendc OPENDC_DB_USERNAME=opendc OPENDC_DB_PASSWORD=opendc \
            nohup bin/opendc-server > "$RUNNER_TEMP/opendc-server.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          timeout 180 sh -c 'until curl -sf http://localhost:8080/api/v1/config > /dev/null; do sleep 2; done'
          deploy/smoke-test.sh
      - name: Show the server log
        if: failure() && runner.os == 'Linux'
        run: cat "$RUNNER_TEMP/opendc-server.log" || true
      - name: Publish report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: test (Java ${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload reports
        if: always()
        continue-on-error: true # See https://github.com/actions/upload-artifact/issues/270
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            ./**/build/reports/**/*
            ./**/build/test-results/**/*
          retention-days: 5
      - name: Upload build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            ./**/build/distributions/**/*.zip
          retention-days: 5
      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml
  build-docker:
    name: Build Docker Image (${{ matrix.image }})
    if: github.repository == 'atlarge-research/opendc'
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        image: [ server, launcher ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      # The images package the distribution Gradle builds, so the build context is this checkout.
      - name: Build distribution
        run: ./gradlew :opendc-web:opendc-web-${{ matrix.image }}:installDist
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: opendc-web/opendc-web-${{ matrix.image }}/Dockerfile
          push: false
