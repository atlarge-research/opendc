# The OpenDC documentation site, built with Zensical (https://zensical.org).
#
#   uvx zensical serve     preview at http://localhost:8000
#   uvx zensical build     write the static site to site/

[project]
site_name = "OpenDC"
site_description = "Collaborative Datacenter Simulation and Exploration for Everybody"
site_author = "AtLarge Research"
copyright = "Copyright &copy; 2026 AtLarge Research"
repo_url = "https://github.com/atlarge-research/opendc"
repo_name = "atlarge-research/opendc"
edit_uri = "edit/master/docs/"
# Set site_url once the hosting location is fixed. Instant navigation ("navigation.instant") needs it.
# site_url = "https://opendc.org/"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/entry-points.md",
    "getting-started/installation.md",
    "getting-started/first-experiment.md",
    "getting-started/concepts.md",
    "getting-started/next-steps.md",
  ] },
  { "Reference" = [
    { "Experiment File" = [
      "reference/experiment/index.md",
      { "Topology" = [
        "reference/experiment/topology/index.md",
        "reference/experiment/topology/host.md",
        "reference/experiment/topology/power-model.md",
        "reference/experiment/topology/distribution-policy.md",
        "reference/experiment/topology/virtualization-overhead.md",
        "reference/experiment/topology/power-source.md",
        "reference/experiment/topology/battery.md",
      ] },
      "reference/experiment/workload.md",
      "reference/experiment/allocation-policy.md",
      "reference/experiment/failure-model.md",
      "reference/experiment/checkpoint-model.md",
      "reference/experiment/export-model.md",
    ] },
    { "Output" = [
      "reference/output/index.md",
      "reference/output/host.md",
      "reference/output/task.md",
      "reference/output/service.md",
      "reference/output/energy.md",
      "reference/output/meta.md",
    ] },
    "reference/units.md",
    "reference/cli.md",
  ] },
  { "Kotlin SDK" = [
    "kotlin-sdk/index.md",
    "kotlin-sdk/model.md",
    "kotlin-sdk/runner.md",
  ] },
  { "Python SDK" = [
    "python-sdk/index.md",
    "python-sdk/specs.md",
    "python-sdk/traces.md",
    "python-sdk/results.md",
    "python-sdk/server.md",
    "python-sdk/internals.md",
  ] },
  { "Web" = [
    "web/index.md",
    "web/using.md",
    "web/execution.md",
    "web/api.md",
    "web/deployment.md",
    "web/configuration.md",
    "web/operations.md",
  ] },
  { "Development" = [
    "development/index.md",
    "development/intellij.md",
    "development/architecture.md",
    "development/building.md",
    "development/contributing.md",
  ] },
  { "OpenDC 2" = [
    "opendc-2/index.md",
    "opendc-2/migrating.md",
    "opendc-2/running.md",
    "opendc-2/experiment.md",
    "opendc-2/topology.md",
    "opendc-2/workload.md",
    "opendc-2/allocation-policy.md",
    "opendc-2/output.md",
    "opendc-2/units.md",
    "opendc-2/m3sa.md",
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
# System fonts, as on opendc.org, and no request to a font service.
font = false
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# One brand colour, in both schemes.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra.status]
deprecated = "Describes OpenDC 2, which is no longer developed"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.blocks.caption = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
# Example files under docs/examples are included in pages by path and are downloadable as they are.
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tilde = {}
