[versions]
calcite = "1.36.0"
clikt = "4.2.1"
clikt5 = "5.0.3"
commons-math3 = "3.6.1"
dokka = "2.2.0"
# Follows the version the Quarkus BOM manages, which the server enforces.
fabric8 = "7.5.2"
hadoop = "3.3.6"
jackson = "2.16.1"
jandex-gradle = "1.1.0"
java = "21"
jline = "3.25.1"
jmh-gradle = "0.7.1"
junit-jupiter = "5.10.2"
kotlin = "2.3.20"
kotlin-logging = "3.0.5"
kotlinx-coroutines = "1.8.0"
kotlinx-serialization = "1.6.0"
log4j = "2.25.3"
microprofile-config = "3.1"
mockk = "1.13.9"
mordant = "3.0.2"
gradle-node = "7.1.0"
node = "22.13.0"
pnpm = "11.3.0"
aws-sdk = "2.31.78"
parquet = "1.13.1"
progressbar = "0.10.0"
quarkus = "3.33.1"
slf4j = "2.0.9"
spotless = "6.25.0"
# Follows the Quarkus BOM; sshd-sftp has to move together with sshd-core.
sshd = "2.17.1"

[libraries]
# Kotlin
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Logging
kotlin-logging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlin-logging" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }

# Testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# CLI
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
clikt5 = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt5" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
mordant-coroutines = { module = "com.github.ajalt.mordant:mordant-coroutines", version.ref = "mordant" }
progressbar = { module = "me.tongfei:progressbar", version.ref = "progressbar" }

# Format
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-dataformat-csv = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-csv", version.ref = "jackson" }
parquet = { module = "org.apache.parquet:parquet-hadoop", version.ref = "parquet" }

# Quarkus
quarkus-gradle-application = { module = "io.quarkus:gradle-application-plugin", version.ref = "quarkus" }
quarkus-bom = { module = "io.quarkus:quarkus-bom", version.ref = "quarkus" }
quarkus-kotlin = { module = "io.quarkus:quarkus-kotlin" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-security = { module = "io.quarkus:quarkus-security" }
quarkus-oidc = { module = "io.quarkus:quarkus-oidc" }
quarkus-hibernate-orm-panache = { module = "io.quarkus:quarkus-hibernate-orm-panache" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
quarkus-jdbc-h2 = { module = "io.quarkus:quarkus-jdbc-h2" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
quarkus-scheduler = { module = "io.quarkus:quarkus-scheduler" }
quarkus-redis-client = { module = "io.quarkus:quarkus-redis-client" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-kotlin-serialization = { module = "io.quarkus:quarkus-rest-kotlin-serialization" }
quarkus-hibernate-orm-panache-kotlin = { module = "io.quarkus:quarkus-hibernate-orm-panache-kotlin" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-micrometer-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }

# Quarkus (Testing)
quarkus-junit5-core = { module = "io.quarkus:quarkus-junit" }
quarkus-jacoco = { module = "io.quarkus:quarkus-jacoco" }
quarkus-test-security = { module = "io.quarkus:quarkus-test-security" }
# An OIDC provider on WireMock, in process, so Auth0 mode is tested without a container.
quarkus-test-oidc-server = { module = "io.quarkus:quarkus-test-oidc-server" }
restassured-core = { module = "io.rest-assured:rest-assured" }

# Object storage. The plain SDK rather than the Quarkus extension: object storage is a production
# concern, and the extension validates its configuration at startup, which a dev run keeping traces
# on disk has none of. The SDK speaks to any S3-compatible endpoint, not only AWS.
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }

# Kubernetes. The JDK HTTP client rather than the default Vert.x one, so the server does not start a
# second Vert.x beside Quarkus' own; the mock server runs a cluster API in process for tests.
fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }
fabric8-kubernetes-httpclient-jdk = { module = "io.fabric8:kubernetes-httpclient-jdk", version.ref = "fabric8" }
fabric8-kubernetes-server-mock = { module = "io.fabric8:kubernetes-server-mock", version.ref = "fabric8" }

# SSH to a SLURM head node, and an embeddable server of the same library for tests.
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }

# Calcite (SQL)
calcite-core = { module = "org.apache.calcite:calcite-core", version.ref = "calcite" }
jline = { module = "org.jline:jline", version.ref = "jline" }

# Other
hadoop-common = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop" }
hadoop-mapreduce-client-core = { module = "org.apache.hadoop:hadoop-mapreduce-client-core", version.ref = "hadoop" }
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }
microprofile-config = { module = "org.eclipse.microprofile.config:microprofile-config-api", version.ref = "microprofile-config" }

# Other (Build)
gradle-node = { module = "com.github.node-gradle:gradle-node-plugin", version.ref = "gradle-node" }
dokka-gradle = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
jmh-gradle = { module = "me.champeau.jmh:jmh-gradle-plugin", version.ref = "jmh-gradle" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
